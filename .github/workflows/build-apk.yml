name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/PanelBarcodeTracker.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PanelBarcodeTracker-debug-apk
          path: ${{ runner.temp }}/PanelBarcodeTracker.apk
      - name: Publish as GitHub Release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/PanelBarcodeTracker.apk" --title "Latest APK" --notes "Debug build of ${GITHUB_SHA::7} (run #${GITHUB_RUN_NUMBER})" --target "$GITHUB_SHA"
      - name: Keep a copy of the APK on branch apk-build
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk-build
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/PanelBarcodeTracker.apk" .
          git add PanelBarcodeTracker.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f origin apk-build

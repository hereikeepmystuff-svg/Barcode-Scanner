plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kec.panelbarcode'
    compileSdk 34

    // Fixed signing key so every build is signed the same way: a new APK installs
    // over the old one and keeps the data on the phone. (Personal sideloaded app only.)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.kec.panelbarcode'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
